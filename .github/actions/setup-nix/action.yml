name: Setup Nix
description: >
  Install Nix and restore the /nix store from the GitHub Actions cache
  (cache-nix-action replaces the deprecated magic-nix-cache). The cache is
  saved only from main, so PRs reuse it without spending the 10GB quota.

inputs:
  extra-nix-conf:
    description: >
      Extra nix.conf lines appended after the defaults, e.g. a `system` or
      `extra-platforms` override for cross builds.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        nix_conf: |
          experimental-features = nix-command flakes
          extra-substituters = https://cache.nixcache.org
          extra-trusted-public-keys = nixcache.org-1:fd7sIL2BDxZa68s/IqZ8kvDsxsjt3SV4mQKdROuPoak=
          ${{ inputs.extra-nix-conf }}

    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size-linux: 4G
        save: ${{ github.ref == 'refs/heads/main' }}
